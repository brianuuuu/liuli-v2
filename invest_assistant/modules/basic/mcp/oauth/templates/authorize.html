<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权 {{ client_name }} 访问琉璃 MCP</title>
</head>
<body>
  <main>
    <h1>授权 {{ client_name }}</h1>
    <p>回调域名：{{ callback_host }}</p>
    <p>申请权限：{{ scopes | join(' ') }}</p>
    <h2>可用工具</h2>
    <ul>
      {% for tool in allowed_tools %}<li>{{ tool }}</li>{% endfor %}
    </ul>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form action="{{ form_action }}" method="post" autocomplete="off">
      <input type="hidden" name="request_id" value="{{ request_id }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>用户名 <input type="text" name="username" required maxlength="128" autocomplete="username"></label>
      <label>密码 <input type="password" name="password" required maxlength="1024" autocomplete="current-password"></label>
      <button type="submit" name="action" value="approve">同意并继续</button>
      <button type="submit" name="action" value="cancel" formnovalidate>取消</button>
    </form>
  </main>
</body>
</html>
